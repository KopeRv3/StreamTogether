server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # La app es una SPA: cualquier ruta desconocida devuelve index.html para
  # que el enrutador del lado del cliente la resuelva
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Los assets de Vite llevan hash en el nombre, se pueden cachear para siempre
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
  }

  # index.html nunca se cachea: si no, los usuarios siguen viendo builds viejos
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
  }

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  client_max_body_size 2m;
}
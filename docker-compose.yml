services:
  db:
    image: postgres:17-alpine
    container_name: streamtogether-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: streamtogether
      POSTGRES_PASSWORD: streamtogether
      POSTGRES_DB: streamtogether
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U streamtogether']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:

# Despliegue en Render (https://render.com)
#
# Sube este repositorio en Render > New > Blueprint y apunta a este archivo.
#
# IMPORTANTE: se usa el runtime NATIVO de Node, no Docker.
#
# Con Docker el despliegue fallo cinco veces seguidas por detalles que solo
# aparecen dentro de la imagen: Alpine sin OpenSSL, permisos de escritura
# como usuario node, y el motor de Prisma desapareciendo al podar. El runtime
# nativo de Render ya es Ubuntu con glibc y OpenSSL correctos, asi que esa
# clase de problemas no existe.
#
# El Dockerfile se conserva en el repositorio para quien quiera usarlo, pero
# Render no lo usa.

databases:
  - name: streamtogether-db
    databaseName: streamtogether
    user: streamtogether
    plan: free
    postgresMajorVersion: '17'

services:
  - type: web
    name: streamtogether-api
    runtime: node
    plan: free
    rootDir: server

    # installDependencies: npm ci
    buildCommand: npm run build

    # Las migraciones se aplican antes de cada despliegue. `migrate deploy`
    # solo aplica lo declarado en prisma/migrations y nunca borra datos.
    preDeployCommand: npx prisma migrate deploy

    startCommand: npm start
    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: streamtogether-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 30d
      # OJO: poner aqui el dominio del frontend en Vercel.
      # Varios origenes separados por coma.
      - key: CLIENT_URL
        sync: false
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: MAX_FILE_SIZE
        value: 524288000
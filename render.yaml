# Despliegue en Render (https://render.com)
#
# Sube este repositorio en Render > New > Blueprint y apunta a este archivo.
# Render creara el backend y la base de datos Postgres a la vez.
#
# IMPORTANTE: el plan gratuito apaga el servicio tras 15 minutos sin uso.
# La primera visita despues de eso tarda ~1 minuto en despertar.

databases:
  - name: streamtogether-db
    databaseName: streamtogether
    user: streamtogether
    plan: free
    postgresMajorVersion: '17'

services:
  - type: web
    name: streamtogether-api
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: streamtogether-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 30d
      # OJO: cambiar por el dominio real del frontend en Vercel.
      # Varios origenes van separados por coma.
      - key: CLIENT_URL
        sync: false
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: MAX_FILE_SIZE
        value: 524288000